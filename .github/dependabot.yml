# Dependabot: PRs automáticos de atualização (e alertas de segurança).
# Ative também em Settings → Code security: "Dependabot alerts" e "security updates".
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dependencias-de-desenvolvimento:
        dependency-type: development
      patch-e-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      patch-e-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /frontend/android
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
